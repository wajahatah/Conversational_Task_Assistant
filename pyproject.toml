[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conversational-task-assistant"
version = "0.1.0"
description = "A smart, event-driven conversational task manager for Telegram."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "wajahatah" }]

dependencies = [
    # ── Web Framework ─────────────────────────────────────────────────────────
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    # ── Database (PostgreSQL + Async ORM) ────────────────────────────────────
    "sqlalchemy[asyncio]==2.0.40",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.15.2",
    # ── Config & Validation ───────────────────────────────────────────────────
    "pydantic==2.11.2",
    "pydantic-settings==2.8.1",
    "python-dotenv==1.1.0",
    # ── Task Queue & Scheduling ───────────────────────────────────────────────
    "celery[redis]==5.5.1",
    "redis==5.2.1",
    # ── Telegram ──────────────────────────────────────────────────────────────
    "python-telegram-bot==21.11.1",
    # ── Discord ───────────────────────────────────────────────────────────────
    "discord-py==2.3.2",
    # ── LLM Providers ─────────────────────────────────────────────────────────
    "openai==1.72.0",
    "google-generativeai==0.8.4",
    "anthropic==0.49.0",
    "ollama==0.4.8",
    # ── HTTP Client ───────────────────────────────────────────────────────────
    "httpx==0.28.1",
    # ── Date / Time / Timezone ────────────────────────────────────────────────
    "python-dateutil==2.9.0",
    "pytz==2025.2",
    # ── Utilities ─────────────────────────────────────────────────────────────
    "tenacity==9.1.2",
    "structlog==25.3.0",
]

[project.optional-dependencies]
# Install this group only when running local HuggingFace inference
huggingface = [
    "transformers==4.51.2",
    "accelerate>=0.26.0",
    # CPU-only torch — swap the index-url at install time for CUDA builds
    "torch==2.6.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
]

[tool.uv]
# Pin the default dependency groups that uv sync should install
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]
